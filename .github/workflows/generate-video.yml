name: Generate Videos

on:
  repository_dispatch:
    types: [generate-video-batch]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install npm dependencies
        run: npm ci

      - name: Ensure Remotion browser
        run: npx remotion browser ensure
        working-directory: apps/api

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Generate video batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUFY_ACCESS_KEY: ${{ secrets.SUFY_ACCESS_KEY }}
          SUFY_SECRET_KEY: ${{ secrets.SUFY_SECRET_KEY }}
          SUFY_BUCKET_NAME: ${{ secrets.SUFY_BUCKET_NAME }}
          SUFY_ORIGIN_DOMAIN: ${{ secrets.SUFY_ORIGIN_DOMAIN }}
          SUFY_CDN_DOMAIN: ${{ secrets.SUFY_CDN_DOMAIN }}
          SUFY_URL_SIGNING_KEY: ${{ secrets.SUFY_URL_SIGNING_KEY }}
          REMOTION_GL: swiftshader
          FFMPEG_PATH: /usr/bin/ffmpeg
          VIDEO_IDS: ${{ toJson(github.event.client_payload.videoIds) }}
        run: npx ts-node -P tsconfig.json src/generator/run-batch.ts
        working-directory: apps/api
